name: Node.js CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'next/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'next/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"
          cache-dependency-path: next/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
        env:
          OPENAI_API_KEY: sk-0000000000
      - run: npm run lint

